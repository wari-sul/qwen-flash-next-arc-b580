# /etc/pve/lxc/<CTID>.conf  (example CT 200, sanitized)
# Unprivileged Ubuntu 26.04 container that shares the host's Arc B580 through /dev/dri.
# The host keeps the xe driver; the card is never reset or unbound.
arch: amd64
cores: 8
description: Strata (Qwen3.8-Flash-Next) on Intel Arc B580 via /dev/dri; xe stays on host
# GIDs must match the render / video groups INSIDE the container: getent group render video
dev0: /dev/dri/renderD128,gid=991
dev1: /dev/dri/card0,gid=44
features: nesting=1
hostname: strata-arc
# NOTE: this limit does NOT cap Strata's pinned expert memory (it is not charged to the CT cgroup).
memory: 53248
# 150G model disk on its own NVMe thin pool, excluded from backups
mp0: models-nvme:vm-200-disk-0,mp=/models,backup=0,size=150G
net0: name=eth0,bridge=vmbr0,ip=dhcp,type=veth
onboot: 1
ostype: ubuntu
rootfs: local-nvme:vm-200-disk-0,size=32G
swap: 0
unprivileged: 1
# Strata page-locks tens of GB of host RAM for the expert mirror
lxc.prlimit.memlock: unlimited
